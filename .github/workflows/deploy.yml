name: Deploy Android download to Cloudflare
on:
  push:
    branches: [main]
    paths: ['public/**', 'wrangler.jsonc', 'package.json', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-download-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Configure the CLOUDFLARE_API_TOKEN repository secret with Workers Scripts Edit permission for the runtick-android-download account.'
            exit 1
          fi
      - name: Deploy existing download Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d0a50c628e69b1a4d3812dabaa3fe5e6
          wranglerVersion: '4.151.0'
          command: deploy --config wrangler.jsonc
      - name: Verify fixed download URL
        run: |
          curl --fail --location --retry 5 --retry-delay 5 --header 'Cache-Control: no-cache' https://download.runtick.cc/runtick-latest.apk -o /tmp/published.apk
          cmp public/runtick-latest.apk /tmp/published.apk
